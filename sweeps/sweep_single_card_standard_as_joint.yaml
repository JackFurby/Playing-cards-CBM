program: main.py
method: bayes
project: playing_cards_CBM
metric:
  name: Test Loss
  goal: minimize
command:
  - ${env}
  - ${interpreter}
  - ${program}
  - ${args}
  - --weighted_loss
parameters:
  lr:
    min: 0.0001
    max: 0.1
  optimizer:
    values: ["adam", "sgd"]
  lr_patience:
    values: [3, 5, 10, 15]
  mode:
    value: joint
  n_classes:
    value: 52
  n_concepts:
    value: 17
  attr_loss_weight:
    value: 0
  dataset_root:
    value: dataset/playing-cards
  dataset_postfix:
    value: splits/single
  epochs:
    value: 100
  batch_size:
    value: 32
  num_workers:
    value: 4
